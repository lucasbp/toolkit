name: DataGrip Toolkit

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: datagrip-toolkit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Test, verify structure and package
        shell: pwsh
        run: ./build.ps1
      - name: Verify DataGrip compatibility
        shell: pwsh
        run: |
          ./gradlew.bat --no-daemon verifyPlugin
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: datagrip-toolkit-${{ github.sha }}
          path: |
            build/distributions/datagrip-toolkit-*.zip
            build/distributions/datagrip-toolkit-*.sha256
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: datagrip-toolkit-reports-${{ github.sha }}
          path: build/reports/
          if-no-files-found: ignore
          retention-days: 7
